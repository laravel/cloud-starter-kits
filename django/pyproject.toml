[project]
name = "django-starter-kit"
version = "0.1.0"
description = "A minimal Django app on Laravel Cloud"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# whitenoise warns when collectstatic hasn't run, which it never has in tests.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
