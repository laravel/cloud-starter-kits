# Regenerates the Laravel kits from their latest upstream versions every week and opens
# (or updates) a pull request when anything changed. Pull requests opened with GITHUB_TOKEN
# don't trigger other workflows, so set the SYNC_TOKEN secret to a token that can push
# branches and open pull requests here to have "Test and split" run on them.

name: Sync Laravel kits

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Laravel kits
    if: github.repository == 'laravel/cloud-starter-kits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Resolve dependencies with the kits' minimum PHP version, so the lockfiles install on every supported version.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: tooling/sync-laravel

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: sync-laravel
          delete-branch: true
          commit-message: 'laravel: sync kits with upstream'
          title: 'laravel: sync kits with upstream'
          body: |
            Reran `tooling/sync-laravel`, which regenerates the Laravel kits from the latest upstream versions with fresh dependencies. `tooling/laravel-sources.json` shows the upstream commits.
