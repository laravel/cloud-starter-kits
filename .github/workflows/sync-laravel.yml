# Regenerates the Laravel kits from their latest upstream versions every day, at the same time
# as the dependency updates for the other kits, and opens (or updates) a pull request with one
# commit per kit that changed. Pull requests opened with GITHUB_TOKEN don't trigger other
# workflows, so set the SYNC_TOKEN secret to a token that can push branches and open pull
# requests here to have "Test and split" run on them.

name: Sync Laravel kits

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Laravel kits
    if: github.repository == 'laravel/cloud-starter-kits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Resolve dependencies with the kits' minimum PHP version, so the lockfiles install on every supported version.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # create-pull-request moves these commits onto the pull request branch.
      - name: Sync and commit each kit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for kit in $(jq -r 'keys[]' tooling/laravel-sources.json); do
            tooling/sync-laravel "$kit"
            git add "$kit" tooling/laravel-sources.json
            if ! git diff --cached --quiet; then
              git commit --quiet -m "$kit: sync with upstream" \
                -m "$(jq -r --arg kit "$kit" '"Generated from upstream \(.[$kit].version) (\(.[$kit].reference[0:7])) with fresh dependencies."' tooling/laravel-sources.json)"
            fi
          done

      # Pinned to a commit: this step gets a token that can push branches and open pull requests.
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: sync-laravel
          delete-branch: true
          title: 'laravel: sync kits with upstream'
          body: |
            Reran `tooling/sync-laravel`, which regenerates the Laravel kits from the latest upstream versions with fresh dependencies. Each kit that changed has its own commit, and `tooling/laravel-sources.json` shows the upstream commits.
