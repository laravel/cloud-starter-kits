[project]
name = "fastapi-starter-kit"
version = "0.1.0"
description = "A minimal FastAPI app on Laravel Cloud"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.160.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
